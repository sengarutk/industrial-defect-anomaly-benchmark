# Single source of truth for the benchmark. Every script reads this file;
# command-line flags only override individual entries.
dataset:
  root: "data/mvtec_ad"
  categories: ["bottle", "cable", "carpet", "grid", "hazelnut", "leather", "metal_nut"]
  img_size: 256
  # Fraction of train/good held out (never used for fitting) to calibrate
  # nominal-only thresholds without touching the test set.
  calib_fraction: 0.2

seeds: [42, 123, 2026]

methods:
  patchcore:
    backbone: "resnet18"
    coreset_sampling_ratio: 0.10
    projection_dim: 128
    smoothing_sigma: 4.0
  padim:
    backbone: "resnet18"
    reduced_dim: 100
    reg_lambda: 0.01
    smoothing_sigma: 4.0
  autoencoder:
    epochs: 40
    lr: 0.001
    weight_decay: 0.00001
    batch_size: 16
    smoothing_sigma: 4.0

training:
  batch_size: 8

robustness:
  enabled: true
  corruptions: ["gaussian_blur", "motion_blur", "brightness_drop", "gaussian_noise", "jpeg_compression", "downscale_restore"]
  severities: [1, 2, 3]

profiling:
  enabled: true
  warmup_runs: 50
  active_runs: 300
  e2e_runs: 100

output:
  results_dir: "results/mvtec_ad"
